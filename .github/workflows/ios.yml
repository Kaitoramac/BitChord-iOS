# Builds an unsigned BitChord.ipa on a GitHub-hosted Mac. No Mac needed locally:
# download the artifact, then sign and install it with SideStore, AltStore or Sideloadly.
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26 (iOS 26 SDK). If this label is not available on your account, use macos-latest.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native downloads its toolchain (~1 GB) on the first build; cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Kotlin tests (offline)
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build (unsigned)
        run: |
          mkdir -p build
          xcodebuild -version
          # Full log to a file; on failure print the errors and fail the job (nothing is swallowed).
          if ! xcodebuild \
            -project iosApp/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1; then
            echo "::group::Errors"
            grep -E "error:|e: file:|FAILED" build/xcodebuild.log | head -80
            echo "::endgroup::"
            tail -40 build/xcodebuild.log
            exit 1
          fi
          grep -E "embedAndSignAppleFrameworkForXcode|BUILD SUCCEEDED" build/xcodebuild.log | tail -5
          # The bundle directory exists even after a failed compile: check the executable itself.
          APP=build/DerivedData/Build/Products/Release-iphoneos/BitChord.app
          test -x "$APP/BitChord"
          ls -lh "$APP/BitChord"

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qry BitChord-unsigned.ipa Payload
          ls -lh BitChord-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-unsigned-ipa
          path: BitChord-unsigned.ipa
          retention-days: 14

      # On failure, the full log is what to paste back for fixing compile errors.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
