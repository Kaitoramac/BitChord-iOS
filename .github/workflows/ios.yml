# Builds an unsigned BitChord.ipa on a GitHub-hosted Mac. No Mac needed locally:
# download the artifact, then sign and install it with SideStore, AltStore or Sideloadly.
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26 (iOS 26 SDK). If this label is not available on your account, use macos-latest.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native downloads its toolchain (~1 GB) on the first build; cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Kotlin tests (offline)
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build (unsigned)
        run: |
          mkdir -p build
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -project iosApp/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|warning: .*BitChord|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/DerivedData/Build/Products/Release-iphoneos/BitChord.app

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qry BitChord-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-unsigned-ipa
          path: BitChord-unsigned.ipa
          retention-days: 14

      # On failure, the full log is what to paste back for fixing compile errors.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
