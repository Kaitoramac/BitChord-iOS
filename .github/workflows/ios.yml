# Builds an unsigned BitChord.ipa on a GitHub-hosted Mac (no Mac needed locally).
# Pull requests: build only, IPA kept as an artifact.
# Pushes to main: also a GitHub release with BitChord.ipa and source.json, the
# SideStore source the phone updates from (see README, "Phone-only workflow").
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create the release on main

env:
  # Every build gets a higher CFBundleVersion, so SideStore sees it as an update.
  BUILD_NUMBER: ${{ github.run_number }}
  APP_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26 (iOS 26 SDK). If this label is not available on your account, use macos-latest.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native downloads its toolchain (~1 GB) on the first build; cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Kotlin tests (offline)
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build (unsigned)
        run: |
          mkdir -p build
          xcodebuild -version
          # Full log to a file; on failure print the errors and fail the job (nothing is swallowed).
          if ! xcodebuild \
            -project iosApp/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$APP_VERSION" \
            build > build/xcodebuild.log 2>&1; then
            echo "::group::Errors"
            grep -E "error:|e: file:|FAILED" build/xcodebuild.log | head -80
            echo "::endgroup::"
            tail -40 build/xcodebuild.log
            exit 1
          fi
          grep -E "embedAndSignAppleFrameworkForXcode|BUILD SUCCEEDED" build/xcodebuild.log | tail -5
          # The bundle directory exists even after a failed compile: check the executable itself.
          APP=build/DerivedData/Build/Products/Release-iphoneos/BitChord.app
          test -x "$APP/BitChord"
          ls -lh "$APP/BitChord"

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BitChord.app Payload/
          zip -qry BitChord-unsigned.ipa Payload
          ls -lh BitChord-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-unsigned-ipa
          path: BitChord-unsigned.ipa
          retention-days: 14

      - name: Publish release and SideStore source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$BUILD_NUMBER"
          cp BitChord-unsigned.ipa BitChord.ipa
          NOTES="$(git log -1 --pretty=%s)"
          python3 .github/scripts/make_source.py \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --build "$BUILD_NUMBER" --version "$APP_VERSION" \
            --ipa BitChord.ipa --notes "$NOTES" > source.json
          gh release create "$TAG" BitChord.ipa source.json \
            --title "BitChord $APP_VERSION" \
            --notes "$NOTES ($(git rev-parse --short HEAD))" \
            --latest
          # Keep the five most recent builds.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +6 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          echo "SideStore source: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json" >> "$GITHUB_STEP_SUMMARY"

      # On failure, the full log is what to read to fix compile errors.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
