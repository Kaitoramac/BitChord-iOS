# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: BitChord
options:
  bundleIdPrefix: com.music.bitchord
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 mode: the Kotlin-exported types are not Sendable, and Swift 6's strict checking would reject every call.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BitChord:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme BitChord` works in CI without opening Xcode.
    scheme: {}
    sources:
      - path: BitChord
    info:
      path: BitChord/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Kotlin framework, built by the script below (KMP "direct integration").
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, BitChordKit]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build BitChordKit (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
